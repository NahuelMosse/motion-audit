<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A node re-mounted in the middle of its animation</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; }
  button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; transition: background-color 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  button:hover { background: #e4e4e4; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  #host { margin-top: 24px; }
  .bar { height: 24px; width: 0; background: #2a5bd7; border-radius: 4px; }
</style>
</head>
<body>
<button id="open" type="button">Load</button>
<div id="host"></div>
<script>
  // What a framework does when the `key` of a component changes mid-animation: the old node is
  // removed and a new one starts the same animation from zero.
  const host = document.getElementById('host');
  const mount = () => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    host.replaceChildren(bar);
    const start = performance.now();
    const step = (now) => {
      const u = Math.min(1, (now - start) / 800);
      if (!bar.isConnected) return;
      bar.style.width = 270 * (1 - (1 - u) ** 3) + 'px';
      if (u < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  document.getElementById('open').addEventListener('click', () => {
    mount();
    setTimeout(mount, 300);
  });
</script>
</body>
</html>
