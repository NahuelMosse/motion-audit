<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A button that navigates on mousedown</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; display: grid; gap: 16px; justify-items: start; }
  button, a.link { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; color: inherit; text-decoration: none; transition: background-color 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  button:hover, a.link:hover { background: #e4e4e4; }
  button:active, a.link:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
</style>
</head>
<body>
<button id="first" type="button">First</button>
<button id="router" type="button">Go to shadcn</button>
<button id="after" type="button">After the router</button>
<script>
  // A button that routes on mousedown instead of click (a link never gets this far: --interact does not press links).
  document.getElementById('router').addEventListener('mousedown', () => { location.href = '/shadcn.html'; });
</script>
</body>
</html>
