<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A click target with nothing that moves</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; }
  button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
</style>
</head>
<body>
<button id="save" type="button">Save</button>
<script>
  document.getElementById('save').addEventListener('click', () => navigator.sendBeacon('/api/save', 'save'));
</script>
</body>
</html>
