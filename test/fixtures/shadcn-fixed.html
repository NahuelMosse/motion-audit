<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shadcn-style button with listed transition properties, Tailwind preflight link and input</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; display: grid; gap: 16px; justify-items: start; }
  a { color: inherit; text-decoration: inherit; }
  .btn { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 6px; border: 0; font: inherit; font-weight: 500; background: #18181b; color: #fafafa; transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1); }
  .btn:hover { background: #18181be6; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(24 24 27 / 0.35); }
  input { height: 36px; padding: 0 12px; border: 1px solid #d4d4d8; border-radius: 6px; font: inherit; transition: box-shadow 150ms ease-out; }
  input:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(24 24 27 / 0.35); }
  a.link:focus-visible { outline: 2px solid #18181b; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn, input { transition-duration: 1ms; } }
</style>
</head>
<body>
<button class="btn" type="button">Save changes</button>
<a class="link" href="#docs">Read the docs</a>
<input aria-label="Email" placeholder="you@example.com">
</body>
</html>
