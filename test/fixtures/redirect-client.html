<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client-side redirect to the login page</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; }
  button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; transition: background-color 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  button:hover { background: #e4e4e4; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
</style>
</head>
<body>
<button type="button">Dashboard</button>
<script>
  // The session check runs after the page has loaded.
  setTimeout(() => location.replace('/login?next=' + encodeURIComponent(location.pathname)), 200);
</script>
</body>
</html>
