<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A navigation link that is also a disclosure</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; display: grid; gap: 16px; justify-items: start; }
  a, button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; color: inherit; text-decoration: none; transition: background-color 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  a:hover, button:hover { background: #e4e4e4; }
  a:active, button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
</style>
</head>
<body>
<!-- Following the first link is a GET that a server may treat as "mark all as read": nothing may click it. -->
<a id="notifications" href="/notifications" aria-expanded="false">Notifications</a>
<a id="panel-link" href="#panel" aria-expanded="false">Panel</a>
<div id="panel" hidden>Panel</div>
<button id="inside-link-host" type="button" aria-expanded="false">More</button>
<a href="/inbox"><span role="button" tabindex="0" id="wrapped">Wrapped control</span></a>
</body>
</html>
