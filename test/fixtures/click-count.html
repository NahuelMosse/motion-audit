<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A click target that counts its clicks</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; }
  button { font: inherit; border: 1px solid #bbb; background: #f2f2f2; padding: 8px 14px; border-radius: 8px; transition: background-color 140ms cubic-bezier(0.23, 1, 0.32, 1), transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  button:hover { background: #e4e4e4; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid #2a5bd7; outline-offset: 2px; }
  #box { width: 40px; height: 40px; background: #2a5bd7; margin-top: 24px; transform: translateX(0); transition: transform 300ms cubic-bezier(0.23, 1, 0.32, 1); }
  #box.on { transform: translateX(120px); }
  @media (prefers-reduced-motion: reduce) { #box { transition: none; } button:active { transform: none; } }
</style>
</head>
<body>
<button id="save" type="button">Save</button>
<div id="box"></div>
<script>
  document.getElementById('save').addEventListener('click', () => {
    navigator.sendBeacon('/api/save', 'save');
    document.getElementById('box').classList.toggle('on');
  });
</script>
</body>
</html>
