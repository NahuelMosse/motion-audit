# Publishes to npm whenever main (or a v* tag) carries a version that npm does not have yet, then tags that commit
# v<version>. Releasing is merging a pull request that raises the version in package.json, plugin.json and CHANGELOG.md;
# Dependabot updates that reach the package raise it by themselves (dependabot-automerge.yml).
# The first version is published by hand, because npm trusted publishing can only be configured on an existing package;
# until then the plan finds the package missing and nothing runs. Once it is on npm, a version that is already published
# only gets its v<version> tag, if that is missing, on the commit npm recorded for it (gitHead; no tag if there is none
# or it is not in this repository). A version this run publishes is tagged with the run's own commit.
# Two jobs, so that the code that runs the tests and its dependencies never holds the publishing token: `test` has
# read-only permissions, `publish` installs nothing. `test` makes the plan and exposes it as outputs, and `publish` reads only those:
# a plan recomputed there could differ from the one the tests covered (none at one moment, publish at the next).
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # A merge that GitHub's auto-merge makes on behalf of GITHUB_TOKEN starts no push workflow; the hourly run publishes it.
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      tag-sha: ${{ steps.plan.outputs.tag-sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - id: plan
        run: node .github/scripts/release-plan.mjs
      - name: Install dependencies
        if: steps.plan.outputs.mode != 'none'
        run: npm ci
      - name: Install Chromium
        if: steps.plan.outputs.mode != 'none'
        run: npx playwright install --with-deps chromium
      # The unit tests and the install test of the packed tarball: what the package needs to be correct. The rest of
      # the browser suite and the golden comparison run in ci.yml, split in shards, and `npm test` (all of it in one
      # process) is a combination ci.yml never runs.
      - if: steps.plan.outputs.mode != 'none'
        run: |
          npm run test:unit
          node --test test/package-install.test.mjs
  publish:
    needs: test
    # Nothing to publish and no tag to add (the package is not on npm yet, or the version is out and tagged): skipped.
    if: needs.test.outputs.mode != 'none' || needs.test.outputs.tag-sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Trusted publishing needs npm 11.5.1 or newer
        if: needs.test.outputs.mode == 'publish'
        run: |
          npm install --global npm@11.21.1
          npm --version
      - name: Pack (a branch other than main only shows what would be published)
        if: needs.test.outputs.mode == 'pack'
        run: npm pack --dry-run --ignore-scripts
      - if: needs.test.outputs.mode == 'publish'
        run: npm publish --tag "${{ needs.test.outputs.dist-tag }}"
      - name: Tag the commit the version was published from
        if: needs.test.outputs.tag-sha != ''
        run: |
          tag="v${{ needs.test.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag already exists"; exit 0; fi
          git tag "$tag" "${{ needs.test.outputs.tag-sha }}"
          git push origin "refs/tags/$tag"
