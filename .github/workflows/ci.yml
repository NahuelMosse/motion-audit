name: ci

on:
  push:
    branches: [main, hardening]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install Chromium
        run: npx playwright install chromium
        if: runner.os != 'Linux'
      - run: npm test
      - name: Every fixture three times, identical findings each time
        run: node test/helpers/fixture-runs.mjs 3
        timeout-minutes: 30
      - name: Failing audits exit exactly 1 and unusable audits exit exactly 2
        shell: bash
        run: |
          node test/helpers/serve.mjs skills/motion-audit/fixtures 8765 &
          server=$!
          sleep 2
          set +e
          node skills/motion-audit/scripts/motion-audit.mjs http://127.0.0.1:8765/bad.html > /dev/null
          bad=$?
          node skills/motion-audit/scripts/motion-audit.mjs http://127.0.0.1:8765/good.html > /dev/null
          good=$?
          node skills/motion-audit/scripts/motion-audit.mjs http://127.0.0.1:8765/shadcn.html --only '#nothing' > /dev/null
          empty=$?
          kill $server
          echo "bad=$bad good=$good empty=$empty"
          [ "$bad" = "1" ] && [ "$good" = "0" ] && [ "$empty" = "2" ]
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the plugin
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate .
